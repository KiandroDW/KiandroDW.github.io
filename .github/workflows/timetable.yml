name: Timetable update

on:
  schedule:
    # timezone must be in the SAME list item as cron (no leading "-" on it).
    # 03:13 rather than 03:00 because GitHub delays runs most at the top of the hour.
    - cron: "13 0 * * *"
      timezone: "Europe/Brussels"
  workflow_dispatch: # manual runs

permissions:
  contents: write

concurrency:
  group: timetable-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trainmap
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create venv and install requirements
        run: |
          if [ ! -d .venv ]; then
            python -m venv .venv
            .venv/bin/pip install -r requirements.txt
          fi

      - name: Run timetable script
        run: .venv/bin/python timetable/timetable.py

      - name: Commit and push
        run: |
          date=$(TZ=Europe/Brussels date +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # .venv is already covered by .gitignore, so a plain add skips it.
          git add -A .
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "AUTOMATED ACTION: timetable update $date"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
