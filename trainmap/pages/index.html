<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NMBS real time positions</title>
<script src="./scripts/current_trains.js"></script>
</head>
<body>
<h1>NMBS real time positions</h1>

<button type="button" onclick="location.href='./gtfs_zip_grabber.html'">Go to GTFS zip grabber</button>
<button type="button" onclick="refresh()">Refresh now</button>

<p>Last updated: <span id="updated">never</span></p>
<pre id="output">Loading...</pre>

<script>
async function refresh() {
  const out = document.getElementById("output");
  try {
    // await works whether getPositions() returns an object or a Promise
    const positions = await getPositions();
    out.textContent = JSON.stringify(positions, null, 2);
    document.getElementById("updated").textContent = new Date().toLocaleTimeString();
  } catch (err) {
    out.textContent = "Error: " + err;
  }
}

refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
